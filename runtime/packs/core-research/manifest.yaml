# Core Research Pack - Essential research and analysis skills
schema: zerowall.science/pack/v1
id: core-research
name: Core Research
description: Essential research and analysis skills for scientific workflows
version: 1.0.0

source:
  repo: https://github.com/zerowall/science
  commit: 7064c01922672b008a730a7667b18f3c227e82a8
  path: runtime/packs/core-research
  modified: false

author:
  name: ZeroWall Team
  url: https://zerowall.com

license: MIT

components:
  skills:
    - id: bibliometric-analysis
      name: Bibliometric Analysis
      description: Year trends, venue/author/keyword counts, and coverage over a literature corpus
      path: ../../skills/core/bibliometric-analysis/SKILL.md
      whenToUse: When quantifying a BibTeX, CSV, or JSON literature corpus
      enabled: true

    - id: citation-reviewer
      name: Citation Reviewer
      description: Offline consistency check of citation keys, bibliography fields, and identifiers
      path: ../../skills/core/citation-reviewer/SKILL.md
      whenToUse: Before sharing a manuscript to catch undefined keys and malformed DOIs
      enabled: true

    - id: domain-check
      name: Domain Correctness Check
      description: Validate domain-specific correctness (units, CRS, statistical methods)
      path: ../../skills/core/domain-check/SKILL.md
      whenToUse: After completing analysis to verify domain-specific correctness
      enabled: true

    - id: figure-provenance
      name: Figure Provenance
      description: Trace every figure back to the script that writes it and the data it reads
      path: ../../skills/core/figure-provenance/SKILL.md
      whenToUse: When a figure's origin is unclear or before publishing a figure set
      enabled: true

    - id: large-file
      name: Large File Handler
      description: Handle large datasets with streaming and chunked processing
      path: ../../skills/core/large-file/SKILL.md
      whenToUse: When working with files larger than 100MB
      enabled: true

    - id: modal-run
      name: Modal Remote Execution
      description: Execute compute-intensive jobs on Modal cloud platform
      path: ../../skills/core/modal-run/SKILL.md
      whenToUse: For heavy computation requiring GPUs or distributed processing
      enabled: true

    - id: paper-to-report
      name: Paper to Report
      description: Build a Markdown report scaffold from the workspace's figures, data, and environment
      path: ../../skills/core/paper-to-report/SKILL.md
      whenToUse: When writing up a finished analysis or handing a workspace to a collaborator
      enabled: true

    - id: publication-figures
      name: Publication Figures
      description: Create publication-ready figures with proper styling and export
      path: ../../skills/core/publication-figures/SKILL.md
      whenToUse: When generating figures for papers or presentations
      enabled: true

    - id: remote-compute
      name: Remote Compute Setup
      description: Configure and manage remote compute resources (SSH, HPC, cloud)
      path: ../../skills/core/remote-compute/SKILL.md
      whenToUse: Setting up remote compute environments
      enabled: true

    - id: reproducible-research
      name: Reproducible Research Check
      description: Check project layout, dependency pinning, hard-coded paths, and artifact provenance
      path: ../../skills/core/reproducible-research/SKILL.md
      whenToUse: Before archiving or sharing a project that someone else must rerun
      enabled: true

    - id: stats-integrity
      name: Statistical Integrity Check
      description: Verify statistical analysis correctness and reproducibility
      path: ../../skills/core/stats-integrity/SKILL.md
      whenToUse: After statistical analysis to verify methodological correctness
      enabled: true

    - id: traceability-review
      name: Traceability Review
      description: Review citations, data sources, and computational provenance
      path: ../../skills/core/traceability-review/SKILL.md
      whenToUse: Before finalizing reports to ensure all claims are traceable
      enabled: true

minZeroWallVersion: 0.3.0
