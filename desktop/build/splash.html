<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ZeroWall Science</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { display: grid; place-items: center; color: #17181a; background: #f6f7f8; }
      main { display: grid; justify-items: center; gap: 16px; padding: 32px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 16px; animation: breathe 1.9s ease-in-out infinite; }
      h1 { margin: 2px 0 0; font-size: 23px; font-weight: 650; letter-spacing: 0; }
      p { margin: -7px 0 0; color: #73777f; font-size: 13px; }
      .track { width: 168px; height: 3px; overflow: hidden; border-radius: 99px; background: rgba(20,21,24,.09); }
      .bar { width: 42%; height: 100%; border-radius: inherit; background: #315b7d; animation: travel 1.25s ease-in-out infinite; }
      @keyframes breathe { 50% { transform: scale(1.03); } }
      @keyframes travel { from { transform: translateX(-105%); } to { transform: translateX(345%); } }
      @media (prefers-color-scheme: dark) { body { color: #f3f4f6; background: #17181a; } p { color: #a9adb5; } .track { background: rgba(255,255,255,.12); } }
      @media (prefers-reduced-motion: reduce) { img, .bar { animation: none; } .bar { width: 100%; opacity: .65; } }
    </style>
  </head>
  <body>
    <main>
      <img id="splash-icon" alt="" />
      <h1>ZeroWall Science</h1>
      <p>正在启动科研 Agent 工作台...</p>
      <div class="track" aria-hidden="true"><div class="bar"></div></div>
    </main>
    <script>
      const icon = new URLSearchParams(location.search).get('icon')
      if (icon) document.getElementById('splash-icon').src = icon
    </script>
  </body>
</html>
