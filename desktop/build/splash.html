<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>ZeroWall Science</title>
<style>
:root { color-scheme: light dark; font-family: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei", sans-serif; }
* { box-sizing: border-box; } html, body { width: 100%; height: 100%; margin: 0; }
body { display: grid; place-items: center; background: #f3f5f7; color: #17202b; }
main { width: min(860px, calc(100% - 96px)); padding: 48px 0; transform: translateY(-3vh); }
body::before { content:''; position:fixed; inset:0 0 auto; height:48px; -webkit-app-region:drag; }
header { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 20px; margin-bottom: 38px; }
.mark { display: grid; place-items: center; width: 72px; height: 72px; border: 1px solid #e3e8ee; border-radius: 18px; background: #fff; box-shadow: 0 10px 28px rgba(35, 54, 76, .08); animation: lift 3.4s ease-in-out infinite; will-change: transform; }
img { width: 60px; height: 60px; }
h1 { margin: 0 0 6px; font-size: 30px; line-height: 1.2; font-weight: 680; letter-spacing: 0; }
.subtitle { font-size: 13px; line-height: 20px; color: #6e7886; }
.version { min-width: 92px; text-align: right; color: #7b8592; }
.version span { display: block; margin-bottom: 3px; font-size: 11px; }
.version strong { font-size: 14px; font-weight: 600; color: #344252; font-variant-numeric: tabular-nums; }
.launch { padding-top: 3px; }
.status { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; margin-bottom: 15px; }
#stage { min-width: 0; font-size: 16px; line-height: 24px; font-weight: 620; }
#elapsed { flex: none; font-size: 12px; color: #7b8592; white-space: nowrap; font-variant-numeric: tabular-nums; }
.track { position: relative; width: 100%; height: 14px; overflow: hidden; border-radius: 7px; background: #e3e6ef; }
#bar { position: relative; height: 100%; width: 5%; overflow: hidden; border-radius: inherit; background: #3976b9; transition: width 780ms cubic-bezier(.22, 1, .36, 1), background-color 240ms ease; }
.track::after { content: ''; position: absolute; inset: 0; width: 30%; background: linear-gradient(90deg, transparent, rgba(124, 109, 226, .38), transparent); transform: translateX(-100%); animation: flow 2.4s linear infinite; will-change: transform; }
@keyframes flow { to { transform: translateX(440%); } }
@keyframes lift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
body.failed .mark, body.failed .track::after { animation: none; }
body.failed .track::after { display:none; }
.research { display:flex; align-items:center; gap:12px; margin-bottom:38px; color:#738199; font-size:12px; }
.research span { padding:8px 14px; background:#ffffffa8; border:1px solid #e4e7ef; border-radius:10px; animation:paper 3.6s ease-in-out infinite; }
.research span:nth-child(3) { animation-delay:-1.2s; }
.research span:nth-child(5) { animation-delay:-2.4s; }
@keyframes paper { 50% { transform:translateY(-4px); border-color:#a9afe3; } }
.actions { display:none; gap:12px; margin-top:18px; }
body.failed .actions { display:flex; }
.actions button { padding:10px 18px; border:1px solid #c9d2e0; border-radius:9px; background:#fff; color:#344252; cursor:pointer; }
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 0; margin: 18px 0 0; list-style: none; }
.steps li { position: relative; display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 12px; color: #8a94a1; }
.steps li:nth-child(2), .steps li:nth-child(3) { justify-content: center; }
.steps li:last-child { justify-content: flex-end; }
.steps li::before { content: ''; flex: none; width: 7px; height: 7px; border-radius: 50%; background: #c5cdd6; transition: transform 300ms ease, background-color 300ms ease, box-shadow 300ms ease; }
.steps li.active { color: #2f629d; font-weight: 600; }
.steps li.active::before { transform: scale(1.25); background: #3976b9; box-shadow: 0 0 0 4px rgba(57, 118, 185, .12); }
.steps li.done { color: #3f7c68; }
.steps li.done::before { background: #4a9278; }
#error { display: none; max-height: 180px; overflow: auto; margin: 28px 0 0; padding: 16px 18px; border: 1px solid #f0c9c5; border-radius: 6px; background: #fff4f2; color: #a33d36; font-size: 12px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }
body.failed #bar { background: #bf5b53; }
@media (max-width: 640px) {
  main { width: min(100% - 40px, 720px); padding: 32px 0; transform: none; }
  header { grid-template-columns: auto minmax(0, 1fr); gap: 16px; margin-bottom: 32px; }
  .mark { width: 60px; height: 60px; border-radius: 15px; }
  img { width: 50px; height: 50px; }
  h1 { font-size: 24px; }
  .version { grid-column: 2; min-width: 0; text-align: left; }
  .version span { display: none; }
  .steps li { gap: 6px; }
}
@media (prefers-color-scheme: dark) {
  body { background: #12161b; color: #eef2f6; }
  .mark { border-color: #303843; background: #1b2129; box-shadow: 0 10px 28px rgba(0, 0, 0, .22); }
  .subtitle, #elapsed, .version { color: #8f9aa8; }
  .version strong { color: #cbd3dc; }
  .track { background: #2b333d; box-shadow: inset 0 1px 2px rgba(0, 0, 0, .32); }
  .steps li { color: #768291; }
  .steps li.active { color: #8db9eb; }
  .steps li.done { color: #72b89d; }
  #error { border-color: #633733; background: #31201f; color: #f1aaa3; }
}
@media (prefers-reduced-motion: reduce) { #bar, .steps li::before { transition: none; } .mark, .research span { animation: none; } .track::after { animation-duration:4s; } }
</style>
</head>
<body>
<main>
<header>
  <div class="mark"><img id="icon" alt="" /></div>
  <div><h1>ZeroWall Science</h1><div class="subtitle">科研全流程 · 文献全流程 · 智能医疗 · 开箱即用</div></div>
  <div class="version"><span>当前版本</span><strong id="version">v--</strong></div>
</header>
<section class="launch" aria-label="启动进度">
  <div class="research" aria-hidden="true"><span>科研全流程</span>·<span>文献全流程</span>·<span>智能医疗</span>·<span>开箱即用</span></div>
  <div class="status"><span id="stage" role="status" aria-live="polite">正在准备本地工作台</span><span id="elapsed">0 秒</span></div>
  <div class="track" role="progressbar" aria-label="启动阶段" aria-valuemin="0" aria-valuemax="100" aria-valuenow="5"><div id="bar"></div></div>
  <ol class="steps"><li data-step="15">检查数据</li><li data-step="25">准备环境</li><li data-step="35">科研服务</li><li data-step="85">打开工作台</li></ol>
</section>
<pre id="error" role="alert"></pre>
<div class="actions"><button id="retry">重新启动</button><button id="logs">打开日志</button><button id="quit">退出</button></div>
</main>
<script>
const params = new URLSearchParams(location.search)
const icon = params.get('icon')
if (icon) document.getElementById('icon').src = icon
const version = params.get('version')
if (version) document.getElementById('version').textContent = 'v' + version.replace(/^v/u, '')
const bridge = window.zerowallDesktop
document.getElementById('retry').onclick = () => bridge?.restart()
document.getElementById('logs').onclick = () => bridge?.openLogs()
document.getElementById('quit').onclick = () => bridge?.windowControl('quit-startup')
let state = { startedAt: Date.now(), phase: 'starting', progress: 5 }
function render(next) {
  state = next
  const failed = next.phase === 'failed'
  document.body.classList.toggle('failed', failed)
  document.getElementById('stage').textContent = failed ? '启动未完成' : next.message
  document.getElementById('bar').style.width = next.progress + '%'
  document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow', next.progress)
  document.querySelector('[role="progressbar"]').setAttribute('aria-valuetext', next.message)
  document.getElementById('error').style.display = failed ? 'block' : 'none'
  document.getElementById('error').textContent = failed ? next.message : ''
  const items = [...document.querySelectorAll('[data-step]')]
  let active = items.findLastIndex(item => next.progress >= Number(item.dataset.step))
  if (active < 0) active = 0
  items.forEach((item, index) => {
    const step = Number(item.dataset.step)
    item.className = next.progress >= 100 || next.progress > step ? 'done' : index === active ? 'active' : ''
  })
  tick()
}
function tick() {
  const seconds = Math.max(0, Math.floor((Date.now() - state.startedAt) / 1000))
  document.getElementById('elapsed').textContent = seconds + ' 秒'
}
bridge?.onStartupStatus(render)
bridge?.getStartupStatus().then(render)
setInterval(tick, 1000)
</script>
</body>
</html>
