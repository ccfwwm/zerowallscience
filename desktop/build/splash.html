<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>ZeroWall Science</title>
<style>
:root { color-scheme: light dark; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
* { box-sizing: border-box; } html, body { width: 100%; height: 100%; margin: 0; }
body { display: grid; place-items: center; background: #f6f7f9; color: #202936; }
main { width: min(480px, calc(100% - 64px)); padding: 36px 0; }
header { display: flex; align-items: center; gap: 18px; margin-bottom: 42px; }
img { width: 60px; height: 60px; border-radius: 16px; }
h1 { font-size: 25px; font-weight: 650; margin: 0 0 7px; letter-spacing: -.5px; }
.subtitle, footer { font-size: 12px; color: #7a8594; }
.status { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 13px; }
#stage { font-size: 14px; font-weight: 600; }
#elapsed { font-size: 12px; color: #7a8594; white-space: nowrap; font-variant-numeric: tabular-nums; }
.track { position: relative; height: 5px; background: #e0e6ed; border-radius: 5px; overflow: hidden; }
#bar { height: 100%; width: 5%; background: #537fbc; transition: width 1.2s ease; border-radius: inherit; }
.track::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, #a9cbfa, transparent); transform: translateX(-100%); animation: flow 1.8s linear infinite; will-change: transform; }
header img { animation: breathe 2.4s ease-in-out infinite; will-change: transform, opacity; }
@keyframes flow { to { transform: translateX(100%); } }
@keyframes breathe { 50% { transform: scale(.94); opacity: .7; } }
body.failed .track::after, body.failed header img { animation: none; }
ol { padding: 0; margin: 16px 0 32px; display: flex; justify-content: space-between; list-style: none; font-size: 12px; color: #8a94a2; }
li.active { color: #37649f; font-weight: 600; } li.done { color: #47856f; }
#hint { min-height: 38px; font-size: 12px; line-height: 1.8; color: #7a8594; margin: 0 0 20px; }
#error { display: none; max-height: 180px; overflow: auto; font-size: 12px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; padding: 14px; border-radius: 8px; background: #fff0ef; color: #a53932; }
footer { margin-top: 36px; font-size: 11px; } body.failed #bar { background: #be625a; }
@media (prefers-color-scheme: dark) { body { background: #171b22; color: #e6ebf2; } .track { background: #2d3644; } li.active { color: #8bb8f2; } #error { background: #362325; color: #f3aaa1; } }
@media (prefers-reduced-motion: reduce) { #bar { transition: none; } .track::after, header img { animation: none; } }
</style>
</head>
<body>
<main>
<header><img id="icon" alt="" /><div><h1>ZeroWall Science</h1><div class="subtitle">本地科研工作台 · 6.1.0</div></div></header>
<div class="status"><span id="stage" role="status" aria-live="polite">正在准备本地工作台</span><span id="elapsed">已用 0 秒</span></div>
<div class="track" role="progressbar" aria-label="启动阶段" aria-valuemin="0" aria-valuemax="100" aria-valuenow="5"><div id="bar"></div></div>
<ol><li data-step="15">用户数据</li><li data-step="25">本地环境</li><li data-step="35">核心服务</li><li data-step="85">工作台</li></ol>
<p id="hint">工作台就绪后，将在后台连接已启用的 MCP 服务。</p>
<pre id="error" role="alert"></pre>
<footer>你的会话与设置保存在本机</footer>
</main>
<script>
const icon = new URLSearchParams(location.search).get('icon')
if (icon) document.getElementById('icon').src = icon
const bridge = window.zerowallDesktop
let state = { startedAt: Date.now(), phase: 'starting', progress: 5 }
function render(next) {
  state = next
  const failed = next.phase === 'failed'
  document.body.classList.toggle('failed', failed)
  document.getElementById('stage').textContent = failed ? '启动未完成' : next.message
  document.getElementById('bar').style.width = next.progress + '%'
  document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow', next.progress)
  document.getElementById('error').style.display = failed ? 'block' : 'none'
  document.getElementById('error').textContent = failed ? next.message : ''
  document.querySelectorAll('[data-step]').forEach(item => {
    const step = Number(item.dataset.step)
    item.className = next.progress > step ? 'done' : next.progress === step ? 'active' : ''
  })
  tick()
}
function tick() {
  const seconds = Math.max(0, Math.floor((Date.now() - state.startedAt) / 1000))
  document.getElementById('elapsed').textContent = '已用 ' + seconds + ' 秒'
  document.getElementById('hint').textContent = state.phase === 'failed' ? '启动未完成，诊断信息已自动保存。' : seconds >= 20 ? '正在加载本地服务，请稍候。工作台就绪后会自动打开。' : '工作台就绪后，将在后台连接已启用的 MCP 服务。'
}
bridge?.onStartupStatus(render)
bridge?.getStartupStatus().then(render)
setInterval(tick, 1000)
</script>
</body>
</html>
