- id: hmr
  name: '@deepseek-ai/dsh-hmr'
  # Configuration-only HMR enables official live install/disable/remove.
  # Never watch the workspace/session tree or packed JavaScript modules.
  disabled: false
  config:
    root: []

# Model-visible tool text has a bounded surface; original session events stay
# available. User profile patches are applied after these product defaults.
- id: compaction-tool-result-pruner
  name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
  disabled: false
  config:
    thresholdChars: 8000
    headChars: 4000
    tailChars: 1000

# Keep the structured question composer active in the desktop overlay. A
# disabled renderer leaves only the waiting tool row and no selectable options.
- id: ui-input-trigger
  disabled: false
- id: ui-commands
  disabled: false
- id: ui-skill
  disabled: false
- id: ui-reference
  disabled: false
- id: ui-user-questions
  disabled: false

# Keep the access selector and the Windows execution boundary visible in the
# packaged desktop. The web bundle owns the same rows, but the product patch is
# the final layer and must not leave them disabled in a desktop profile.
- id: ui-permission
  disabled: false
- id: permission
  disabled: false
  config:
    defaultPreset: danger-full-access
- id: sandbox
  disabled: false
- id: sandbox-policy
  disabled: false
- id: approval
  disabled: false
- id: pwsh-sandbox
  disabled: false
- id: tool-pwsh
  disabled: false
- id: tool-fs
  disabled: false
  config:
    readLimit: 200
    readMaxBytes: 16000
- id: tool-fs-search
  disabled: false
  config:
    timeoutMs: 60000
    sampleOverCapGlobResults: false

- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions')
    compression: none
    # These extension records never change the core message surface. Old
    # writers omitted their envelope marker. Adapt the decoded view only:
    # preserve raw history and all plugin payloads even after plugin removal.
    legacyInformationalEventTypes:
      - zerowall/presentation-workflow
      - zerowall/file-extraction
      - zerowall/reviewer/mode
      - zerowall/reviewer/report

# dsh-free-search owns the default search seam. Its provider id remains `ddg`
# while the preferred engine is Bing; keep the independent HTTP fetch provider.
- id: web
  config:
    searchProvider: ddg
    fetchProvider: http

# Titles use local first-prompt fallback until a configured account route exists.
- id: session-title-llm
  disabled: true

# The local Codex assistant is installed on the desktop and its DSH provider
# bundle is part of the runtime closure. Claude remains available through the
# Anthropic API and Claude Science integration, without shipping Claude Code.
- insert:
    - id: subagent-codex
      name: '@deepseek-ai/dsh-subagent-codex'

- id: attachment-local
  config:
    maxImageBytes: 52428800
    maxMessageImageBytes: 104857600
    # Normal high-resolution images are normalized into a preview before the
    # provider limit is applied. Keep the byte limit unchanged while allowing
    # up to 256 MP / 16,384 px; malformed and larger inputs still fail closed.
    maxImagePixels: 268435456
    maxImageDimension: 16384

# The HTTP carrier buffers JSON requests in memory. Keep the aggregate image
# limit (after base64 expansion and envelope headroom) below this explicit cap.
# A mismatch here prevents both event WebSockets from registering, which used
# to leave ask_user_question stuck as a plain tool row with no answer card.
- id: client-connection
  config:
    maxRequestBodyBytes: 167772160

# File Review Tab owns the produced-files Definition and turn-tail row in the
# ZeroWall composition. Disable DSH's stock entry to avoid duplicate
# `conversation Definition "deliverables"` registration during client boot.
- id: ui-deliverables
  disabled: true

# Better Sidebar owns the ZeroWall file-tree entry. Keep Harness workspace file
# APIs and document preview available for open-file navigation and parsing, but
# do not register its second Files tab in the same right sidebar.
- id: ui-sidebar-files
  disabled: true

# The file-backed providers declare their path fields in the runtime schema.
# Keep the product patch explicit so a packaged profile does not leave the
# browser roster waiting forever for the settings service.
- id: settings
  config:
    path: !!js dshHomePath('settings.yaml')
    dshHome: !!js dshHomePath()
    watch: true

- id: credentials
  config:
    path: !!js dshHomePath('.credentials.yaml')
    dshHome: !!js dshHomePath()
    watch: true

- insert:
    - id: ssh-ops
      name: 'dsh-ssh-ops'

    - id: session-notification
      name: '@dingyi222666/dsh-session-notification'

    # Theme is loaded before ZeroWall branding and the right/bottom workbench.
    - id: dream-skin
      name: 'dsh-dream-skin'

    # Generic right/bottom workbench; DSH's native left session sidebar remains.
    - id: better-sidebar
      name: 'dsh-better-sidebar'

    - id: ppt-maker
      name: 'dsh-ppt-maker'

    - id: zotero
      name: 'dsh-zotero'

    - id: zotero-harvest
      name: '@dsh-external/zotero-harvest'

    - id: dsh-wechat
      name: 'dsh-wechat'
      config:
        # QR/login is user initiated in the packaged desktop so it cannot
        # hold the first client boot behind an external network request.
        autoStart: false

    - id: archive-manager
      name: '@michengai/dsh-archive-manager'

    - id: videos
      name: '@zerowallscience/plugin-videos'

    - id: zerowall-base
      name: '@zerowallscience/plugin-base'

    - id: zerowall-secrets
      name: '@zerowallscience/plugin-secrets'
    - id: zerowall-environment
      name: '@zerowallscience/plugin-environment'

    - id: zerowall-desktop-compat
      name: '@zerowallscience/plugin-desktop-compat'

    - id: zerowall-projects
      name: '@zerowallscience/plugin-projects'

    - id: zerowall-mcp
      name: '@zerowallscience/plugin-mcp'

    - id: zerowall-account
      name: '@zerowallscience/plugin-account'

    - id: zerowall-claude-code
      name: '@zerowallscience/plugin-claude-code'

    - id: zerowall-ai-cloud-llm
      name: '@zerowallscience/plugin-ai-cloud'

    - id: zerowall-files
      name: '@zerowallscience/plugin-files'

    - id: zerowall-image-generation
      name: '@zerowallscience/plugin-images'


    - id: zerowall-research
      name: '@zerowallscience/plugin-research'

    - id: zerowall-pubmed
      name: '@zerowallscience/plugin-pubmed'

    - id: zerowall-mineru
      name: '@zerowallscience/plugin-mineru'

    - id: zerowall-singlecell
      name: '@zerowallscience/plugin-singlecell'

    - id: zerowall-execution
      name: '@zerowallscience/plugin-execution'

    - id: zerowall-python
      name: '@zerowallscience/plugin-python'

    - id: zerowall-biogenie
      name: '@zerowallscience/plugin-biogenie'

    - id: zerowall-runs
      name: '@zerowallscience/plugin-runs'

    - id: zerowall-publication
      name: '@zerowallscience/plugin-publications'


    - id: zerowall-skills-plugin
      name: '@zerowallscience/plugin-skills'



    - id: zerowall-extension-center
      name: '@zerowallscience/plugin-extension-center'

# BEGIN GENERATED MANAGED AGENT PRESET OVERRIDES
- id: preset-standard
  name: "@deepseek-ai/dsh-agent-preset"
  config:
    id: standard
    order: 1
    plugins:
      - id: persona
        name: "@deepseek-ai/dsh-persona"
        config:
          prefix: You are a coding agent powered by the {{model}} model.
      - id: agent-instructions
        name: "@deepseek-ai/dsh-agent-instructions"
        config:
          maxBytes: 65536
      - id: time-context
        name: "@deepseek-ai/dsh-time-context"
      - id: tool-bash
        name: "@deepseek-ai/dsh-tool-bash"
        disabled: !!js "process.platform === 'win32'"
      - id: tool-pwsh
        name: "@deepseek-ai/dsh-tool-pwsh"
        disabled: !!js "process.platform !== 'win32'"
      - id: tool-fs
        name: "@deepseek-ai/dsh-tool-fs"
        config:
          readLimit: 200
          readMaxBytes: 16000
      - id: tool-fs-search
        name: "@deepseek-ai/dsh-tool-fs-search"
        config:
          sampleOverCapGlobResults: false
      - id: tool-jobs
        name: "@deepseek-ai/dsh-tool-jobs"
      - id: tool-schedule
        name: "@deepseek-ai/dsh-tool-schedule"
      - id: skill-filesystem
        name: "@deepseek-ai/dsh-skill-filesystem"
      - id: tool-skill
        name: "@deepseek-ai/dsh-tool-skill"
      - id: command-goal
        name: "@deepseek-ai/dsh-command-goal"
      - id: tool-goal
        name: "@deepseek-ai/dsh-tool-goal"
      - id: planning
        name: cordis:group
        group: true
        isolate:
          planMode: true
        config:
          - id: plan-mode
            name: "@deepseek-ai/dsh-plan-mode"
            config:
              section: |
                You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
          - id: compaction-basic
            name: "@deepseek-ai/dsh-compaction-basic"
          - id: command-compact
            name: "@deepseek-ai/dsh-command-compact"
          - id: tool-result-pruner
            name: "@deepseek-ai/dsh-compaction-tool-result-pruner"
            config:
              thresholdChars: 8192
              headChars: 4096
              tailChars: 1024
      - id: delegation
        name: cordis:group
        group: true
        isolate:
          workflowEngine: true
        config:
          - id: tool-subagent-control
            name: "@deepseek-ai/dsh-tool-subagent-control"
          - id: tool-subagent-list-agents
            name: "@deepseek-ai/dsh-tool-subagent-control/list-agents"
          - id: tool-subagent
            name: "@deepseek-ai/dsh-tool-subagent"
            config:
              provider: spawn
              toolName: subagent
              modelSelectionSettings: true
          - id: tool-subagent-fork
            name: "@deepseek-ai/dsh-tool-subagent"
            config:
              provider: fork
              toolName: subagent_fork
          - id: workflow-ptc
            name: "@deepseek-ai/dsh-workflow-ptc"
            config:
              provider: spawn
          - id: tool-workflow
            name: "@deepseek-ai/dsh-tool-workflow"
      - id: tool-ask-user
        name: "@deepseek-ai/dsh-tool-ask-user"
      - id: tool-todo
        name: "@deepseek-ai/dsh-tool-todo"
        config:
          allowParallelInProgress: true
      - id: tool-web
        name: "@deepseek-ai/dsh-tool-web"
        config:
          fetch: true
          searchTimeoutMs: 60000
      - id: present
        name: "@deepseek-ai/dsh-tool-present"
      - id: tool-plugin-manager
        name: "@deepseek-ai/dsh-plugin-manager/tools"
        disabled: true
      - id: tool-plugin-market
        name: "@deepseek-ai/dsh-plugin-market/tools"
        disabled: true
