- id: hmr
  name: '@deepseek-ai/cordis-plugin-hmr'
  # HMR is a development watcher. In the packaged desktop it can observe
  # session/config files written by the running Host and repeatedly reload
  # plugin fibers, growing the embedded Node heap until the window is blank.
  disabled: true
  config:
    root: ['.']

# Keep the structured question composer active in the desktop overlay. A
# disabled renderer leaves only the waiting tool row and no selectable options.
- id: ui-user-questions
  disabled: false

# Keep the access selector and the Windows execution boundary visible in the
# packaged desktop. The web bundle owns the same rows, but the product patch is
# the final layer and must not leave them disabled in a desktop profile.
- id: ui-permission
  disabled: false
- id: permission
  disabled: false
- id: sandbox
  disabled: false
- id: sandbox-policy
  disabled: false
- id: approval
  disabled: false
- id: pwsh-sandbox
  disabled: false
- id: tool-pwsh
  disabled: false
- id: tool-fs
  disabled: false
- id: tool-fs-search
  disabled: false
  config:
    timeoutMs: 60000
    sampleOverCapGlobResults: false

- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions')
    compression: none

# dsh-free-search owns the default search seam. Its provider id remains `ddg`
# while the preferred engine is Bing; keep the independent HTTP fetch provider.
- id: web
  config:
    searchProvider: ddg
    fetchProvider: http

# opencode2dsh is the anonymous, free default. It authenticates with the
# upstream literal `public`, refreshes the free catalog in the background, and
# keeps a verified static fallback so startup never depends on account setup.
- id: session-title-llm
  config:
    targetWords: 5
    targetCjkCharacters: 10
    maxInputBytes: 4096
    maxOutputTokens: 64
    timeoutMs: 60000
    provider: opencode2dsh
    model: big-pickle

- id: agent-default-model
  config:
    provider: opencode2dsh
    model: big-pickle

# Both local coding assistants are installed on the desktop and their DSH
# provider bundles are part of the runtime closure. Keep their tools enabled
# in every preset; they still fail closed when the local CLI is unavailable.
- insert:
    - id: subagent-codex
      name: '@deepseek-ai/dsh-subagent-codex'
    - id: subagent-claude-code
      name: '@deepseek-ai/dsh-subagent-claude-code'

- id: attachment-local
  config:
    maxImageBytes: 52428800
    maxMessageImageBytes: 104857600

# The HTTP carrier buffers JSON requests in memory. Keep the aggregate image
# limit (after base64 expansion and envelope headroom) below this explicit cap.
# A mismatch here prevents both event WebSockets from registering, which used
# to leave ask_user_question stuck as a plain tool row with no answer card.
- id: client-connection
  config:
    maxRequestBodyBytes: 167772160

# File Review Tab owns the produced-files Definition and turn-tail row in the
# ZeroWall composition. Disable DSH's stock entry to avoid duplicate
# `conversation Definition "deliverables"` registration during client boot.
- id: ui-deliverables
  disabled: true

# The file-backed providers declare their path fields in the runtime schema.
# Keep the product patch explicit so a packaged profile does not leave the
# browser roster waiting forever for the settings service.
- id: settings
  config:
    path: !!js dshHomePath('settings.yaml')
    dshHome: !!js dshHomePath()
    watch: true

- id: credentials
  config:
    path: !!js dshHomePath('.credentials.yaml')
    dshHome: !!js dshHomePath()
    watch: true

- insert:
    # Theme is loaded before ZeroWall branding and the right/bottom workbench.
    - id: dream-skin
      name: 'dsh-dream-skin'

    # Generic right/bottom workbench; DSH's native left session sidebar remains.
    - id: better-sidebar
      name: 'dsh-better-sidebar'

    - id: better-sidebar-icons
      name: 'dsh-better-sidebar-icons'

    - id: file-review-tab
      name: 'dsh-file-review-tab'

    # Office viewers extend Better Sidebar and must mount after its service.
    - id: better-sidebar-office
      name: '@huanlin/dsh-plugin-better-sidebar-plugin-office'

    - id: dsh-wechat
      name: 'dsh-wechat'
      config:
        # QR/login is user initiated in the packaged desktop so it cannot
        # hold the first client boot behind an external network request.
        autoStart: false

    - id: capability-menu-registry
      name: '@daweifu/capability-menu/registry'
    - id: capability-menu-search
      name: '@daweifu/capability-menu/search'
    - id: capability-menu-invoke
      name: '@daweifu/capability-menu/invoke'
    - id: capability-menu-policy
      name: '@daweifu/capability-menu/policy'
      config:
        zeroWallDefaults: true
        tools:
          # Keep the model-facing surface small. MCP capabilities remain
          # discoverable through capability_search/execute and are loaded only
          # for the current task instead of serializing every schema on every
          # request.
          on-demand: ['server:*:*', 'server:rmcp', 'server:zerowall_managed_bio_tools']
          resident:
            - capability_search
            - capability_execute
            - structured_output
            - ask_user_question
            - bash
            - read
            - write
            - edit
            - glob
            - grep
            - pwsh
            - terminal_read
            - terminal_send
            - terminal_create
            - terminal_wait_for
            - todo_write
            - python
        skills:
          on-demand: ['*']
          resident: [genui]
    - id: capability-menu
      name: '@daweifu/capability-menu'

    - id: auto-review
      name: 'dsh-auto-review'
      config:
        allowUnmarkedAudit: true
        enableByDefault: false
        language: zh
        fallbackPolicy: delegate
        toolsPolicy:
          overrides:
            bash: ai
            write: ai

    # GenUI renders dsh-ui fences inline and keeps its heavy engines lazy.
    - id: genui
      name: '@changfenhuang/dsh-genui'

    - id: zerowall-base
      name: '@zerowallscience/plugin-base'

    - id: zerowall-secrets
      name: '@zerowallscience/plugin-secrets'
    - id: zerowall-environment
      name: '@zerowallscience/plugin-environment'

    - id: zerowall-desktop-compat
      name: '@zerowallscience/plugin-desktop-compat'

    - id: zerowall-projects
      name: '@zerowallscience/plugin-projects'

    - id: zerowall-mcp
      name: '@zerowallscience/plugin-mcp'

    - id: zerowall-account
      name: '@zerowallscience/plugin-account'

    - id: zerowall-ai-cloud-llm
      name: '@zerowallscience/plugin-ai-cloud'

    - id: zerowall-opencode
      name: '@zerowallscience/plugin-opencode'

    - id: web-search-free
      name: 'dsh-free-search'
      config:
        provider: bing
        bingMarket: zh-CN
        lang: zh
        safeSearch: off
        cache: true
        cacheTtl: 5
        keyStorage: credentials

    - id: zerowall-files
      name: '@zerowallscience/plugin-files'

    - id: zerowall-image-generation
      name: '@zerowallscience/plugin-images'

    - id: zerowall-image-dup
      name: '@zerowallscience/plugin-image-dup'

    - id: zerowall-research
      name: '@zerowallscience/plugin-research'

    - id: zerowall-pubmed
      name: '@zerowallscience/plugin-pubmed'

    - id: zerowall-mineru
      name: '@zerowallscience/plugin-mineru'

    - id: zerowall-singlecell
      name: '@zerowallscience/plugin-singlecell'

    - id: zerowall-execution
      name: '@zerowallscience/plugin-execution'

    - id: zerowall-python
      name: '@zerowallscience/plugin-python'

    - id: zerowall-runs
      name: '@zerowallscience/plugin-runs'

    - id: zerowall-publication
      name: '@zerowallscience/plugin-publications'

    - id: zerowall-presentation
      name: '@zerowallscience/plugin-presentations'

    - id: zerowall-skills-plugin
      name: '@zerowallscience/plugin-skills'

    - id: zerowall-reviewer
      name: '@zerowallscience/plugin-reviewer'

      config:
        channel: ilink
        enabled: true
        autoConnect: false
        dmPolicy: open
        groupPolicy: allowlist
        groups: []
