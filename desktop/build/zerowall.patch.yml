- id: hmr
  name: '@deepseek-ai/cordis-plugin-hmr'
  disabled: false
  config:
    root: ['.']

# Keep the structured question composer active in the desktop overlay. A
# disabled renderer leaves only the waiting tool row and no selectable options.
- id: ui-user-questions
  disabled: false

# Keep the access selector and the Windows execution boundary visible in the
# packaged desktop. The web bundle owns the same rows, but the product patch is
# the final layer and must not leave them disabled in a desktop profile.
- id: ui-permission
  disabled: false
- id: permission
  disabled: false
- id: sandbox
  disabled: false
- id: sandbox-policy
  disabled: false
- id: approval
  disabled: false
- id: pwsh-sandbox
  disabled: false
- id: tool-pwsh
  disabled: false
- id: tool-fs
  disabled: false
- id: tool-fs-search
  disabled: false
  config:
    timeoutMs: 60000
    sampleOverCapGlobResults: false

- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions')
    compression: none

# The ZeroWall provider follows the active AI Cloud DeepSeek route. Keep the
# DSH web seam pinned to it; the stock provider remains bundled for users who
# run an official DeepSeek credential outside the desktop account.
- id: web
  config:
    searchProvider: zerowall-ai-cloud-search

# OpenCode Zen is the anonymous, free default. Its adapter omits
# Authorization when OPENCODE_API_KEY is absent and refreshes the free catalog
# in the background, so the first conversation never depends on account setup.
- id: session-title-llm
  config:
    targetWords: 5
    targetCjkCharacters: 10
    maxInputBytes: 4096
    maxOutputTokens: 64
    timeoutMs: 60000
    provider: opencode-zen
    model: big-pickle

- id: agent-default-model
  config:
    provider: opencode-zen
    model: big-pickle

# Both local coding assistants are installed on the desktop and their DSH
# provider bundles are part of the runtime closure. Keep their tools enabled
# in every preset; they still fail closed when the local CLI is unavailable.
- insert:
    - id: subagent-codex
      name: '@deepseek-ai/dsh-subagent-codex'
    - id: subagent-claude-code
      name: '@deepseek-ai/dsh-subagent-claude-code'

- id: attachment-local
  config:
    maxImageBytes: 52428800
    maxMessageImageBytes: 104857600

# The HTTP carrier buffers JSON requests in memory. Keep the aggregate image
# limit (after base64 expansion and envelope headroom) below this explicit cap.
# A mismatch here prevents both event WebSockets from registering, which used
# to leave ask_user_question stuck as a plain tool row with no answer card.
- id: client-connection
  config:
    maxRequestBodyBytes: 167772160

# The file-backed providers declare their path fields in the runtime schema.
# Keep the product patch explicit so a packaged profile does not leave the
# browser roster waiting forever for the settings service.
- id: settings
  config:
    path: !!js dshHomePath('settings.yaml')
    dshHome: !!js dshHomePath()
    watch: true

- id: credentials
  config:
    path: !!js dshHomePath('.credentials.yaml')
    dshHome: !!js dshHomePath()
    watch: true

- insert:
    # Theme is loaded before ZeroWall branding and the right/bottom workbench.
    - id: dream-skin
      name: 'dsh-dream-skin'

    # Generic right/bottom workbench; DSH's native left session sidebar remains.
    - id: better-sidebar
      name: 'dsh-better-sidebar'

    # Office viewers extend Better Sidebar and must mount after its service.
    - id: better-sidebar-office
      name: '@huanlin/dsh-plugin-better-sidebar-plugin-office'

    - id: zerowall-base
      name: '@zerowallscience/plugin-base'

    - id: zerowall-secrets
      name: '@zerowallscience/plugin-secrets'
    - id: zerowall-environment
      name: '@zerowallscience/plugin-environment'

    - id: zerowall-desktop-compat
      name: '@zerowallscience/plugin-desktop-compat'

    - id: zerowall-projects
      name: '@zerowallscience/plugin-projects'

    - id: zerowall-mcp
      name: '@zerowallscience/plugin-mcp'

    - id: zerowall-account
      name: '@zerowallscience/plugin-account'

    - id: zerowall-ai-cloud-llm
      name: '@zerowallscience/plugin-ai-cloud'

    - id: zerowall-opencode
      name: '@zerowallscience/plugin-opencode'

    - id: zerowall-web-search
      name: '@zerowallscience/plugin-web-search'

    - id: zerowall-files
      name: '@zerowallscience/plugin-files'

    - id: zerowall-image-generation
      name: '@zerowallscience/plugin-images'

    - id: zerowall-image-dup
      name: '@zerowallscience/plugin-image-dup'

    - id: zerowall-research
      name: '@zerowallscience/plugin-research'

    - id: zerowall-execution
      name: '@zerowallscience/plugin-execution'

    - id: zerowall-python
      name: '@zerowallscience/plugin-python'

    - id: zerowall-runs
      name: '@zerowallscience/plugin-runs'

    - id: zerowall-publication
      name: '@zerowallscience/plugin-publications'

    - id: zerowall-presentation
      name: '@zerowallscience/plugin-presentations'

    - id: zerowall-skills-plugin
      name: '@zerowallscience/plugin-skills'

    - id: zerowall-reviewer
      name: '@zerowallscience/plugin-reviewer'

    - id: zerowall-wechat
      name: '@zerowallscience/plugin-wechat'
      config:
        channel: ilink
        enabled: true
        autoConnect: false
        dmPolicy: open
        groupPolicy: allowlist
        groups: []
