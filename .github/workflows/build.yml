name: build

# Builds macOS (.dmg/.app), Windows (NSIS .exe / .msi) and Linux
# (.deb/.rpm/.AppImage) installers. Each platform's installer can only be
# produced on its own runner — hence the matrix. On a `v*` tag push the
# installers are published as a draft Release in the SEPARATE PUBLIC downloads
# repository named by the `DOWNLOADS_REPO` env below.
#
# Architecture: the `create-release` job creates (or confirms) the draft
# release, then each `build` job uploads its installers directly to that
# release via `gh release upload`. This avoids GitHub Actions artifact
# storage entirely — no upload-artifact / download-artifact / publish job.
#
# Why a second repository: GitHub visibility is per-repository. A private repo's
# releases and their assets require authentication to download, and there is no
# setting that exposes a single release, tag, or branch. Keeping the source
# private while letting anyone download an installer therefore needs two repos —
# this one (private: source + CI) and a public one that holds nothing but the
# installers. Nothing from this checkout is pushed there; only the built bundles
# are uploaded as release assets.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Building needs no write access: the release lives in another repository and is
# created with DOWNLOADS_TOKEN, not the automatic per-run GITHUB_TOKEN (which is
# scoped to this repository and cannot reach the public one).
permissions:
  contents: read

env:
  # Public, source-free repository that serves the installers.
  DOWNLOADS_REPO: ccfwwm/zerowallscience-releases

jobs:
  # Create the draft release before the build matrix starts, so every runner
  # can upload into an existing release without racing on creation.
  create-release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      # Standing install/first-launch notes — every draft is born with these
      # (the builds are unsigned/un-notarized, so users must clear Gatekeeper /
      # SmartScreen once). Prepend the per-version changelog before publishing.
      - name: Write release notes
        run: |
          cat > notes.md <<'NOTES'
          ## ⚠️ Install & first launch — unsigned builds

          These installers are **not code-signed or notarized**, so your OS warns on first launch. This is expected; clear it once:

          **macOS** — Apple Silicon: `…_aarch64.dmg` · Intel: `…_x64.dmg` (requires macOS 13+)
          1. Open the DMG and drag **ZeroWall Science** into Applications.
          2. If you see *"… is damaged and can't be opened"* or *"unidentified developer"*, clear the quarantine attribute in Terminal, then open normally:
             ```
             xattr -cr "/Applications/ZeroWall Science.app"
             ```

          **Windows** — `…_x64-setup.exe` or `…_x64_en-US.msi`
          - SmartScreen shows *"Windows protected your PC"* → **More info** → **Run anyway**.

          **Linux** — `.deb` / `.rpm`
          - `sudo apt install ./…_amd64.deb`  or  `sudo rpm -i …x86_64.rpm`

          > ZeroWall Science checks application and environment channels independently. The environment archive and signed manifest are separate release assets and do not require reinstalling the app UI.

          ---

          <!-- Prepend this release's changelog above this line before publishing. -->
          NOTES

      - name: Create or confirm draft release
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADS_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$DOWNLOADS_REPO" >/dev/null 2>&1; then
            echo "release $TAG already exists — builds will --clobber assets"
          else
            gh release create "$TAG" \
              --repo "$DOWNLOADS_REPO" \
              --title "ZeroWall Science $TAG" \
              --notes-file notes.md \
              --draft \
              --target main
            echo "created draft release $TAG"
          fi

  # The environment is a separate release asset. The app installer can remain
  # small and the environment can be updated without reinstalling the UI.
  build-environment:
    if: github.ref_type == 'tag'
    needs: [create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install Bun for ACP adapter bundling
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Require environment bootstrapper signing keys
        shell: bash
        env:
          ZEROWALL_ENV_UPDATE_PUBLIC_KEY: ${{ secrets.ZEROWALL_ENV_UPDATE_PUBLIC_KEY || vars.ZEROWALL_ENV_UPDATE_PUBLIC_KEY }}
          ZEROWALL_ENV_UPDATE_PRIVATE_KEY: ${{ secrets.ZEROWALL_ENV_UPDATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$ZEROWALL_ENV_UPDATE_PUBLIC_KEY" || {
            echo "::error::ZEROWALL_ENV_UPDATE_PUBLIC_KEY is required for environment releases"
            exit 1
          }
          test -n "$ZEROWALL_ENV_UPDATE_PRIVATE_KEY" || {
            echo "::error::ZEROWALL_ENV_UPDATE_PRIVATE_KEY is required for environment releases"
            exit 1
          }
      - name: Fetch environment components
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          bash scripts/dev/fetch-opencode.sh "${{ matrix.target }}"
          bash scripts/dev/fetch-acp-runtimes.sh "${{ matrix.target }}"
          bash scripts/dev/build-acp-adapters.sh "${{ matrix.target }}"
          bash scripts/dev/fetch-skills.sh
          bash scripts/dev/fetch-uv.sh "${{ matrix.target }}"
          bash scripts/dev/fetch-agent-browser.sh "${{ matrix.target }}"
          bash scripts/dev/fetch-goal-plugin.sh
          node scripts/build-mcp-proxy.mjs "$target"
      - name: Build environment bootstrapper
        shell: bash
        env:
          ZEROWALL_ENV_UPDATE_PUBLIC_KEY: ${{ secrets.ZEROWALL_ENV_UPDATE_PUBLIC_KEY || vars.ZEROWALL_ENV_UPDATE_PUBLIC_KEY }}
          ZEROWALL_ENV_MANIFEST_URL: https://github.com/${{ env.DOWNLOADS_REPO }}/releases/latest/download/ZeroWall-Environment-${{ matrix.target }}.tar.gz.json
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          suffix=""
          if [[ "$target" == *windows* ]]; then suffix=".exe"; fi
          cargo build \
            --manifest-path apps/environment-bootstrapper/Cargo.toml \
            --release \
            --target "$target"
          asset="ZeroWall-Environment-Bootstrapper-${target}${suffix}"
          cp "apps/environment-bootstrapper/target/$target/release/zerowall-environment-bootstrapper${suffix}" \
            "$RUNNER_TEMP/$asset"
          echo "ENVIRONMENT_BOOTSTRAPPER=$RUNNER_TEMP/$asset" >> "$GITHUB_ENV"
      - name: Package and sign environment
        shell: bash
        env:
          ZEROWALL_ENV_UPDATE_PRIVATE_KEY: ${{ secrets.ZEROWALL_ENV_UPDATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          suffix=""
          if [[ "$target" == *windows* ]]; then suffix=".exe"; fi
          stage="$RUNNER_TEMP/zerowall-environment-$target"
          rm -rf "$stage"
          mkdir -p "$stage"
          copy_binary() {
            local name="$1"
            cp "apps/desktop/src-tauri/binaries/${name}-${target}${suffix}" "$stage/${name}${suffix}"
          }
          copy_binary opencode
          copy_binary uv
          copy_binary agent-browser
          copy_binary claude-code-acp
          copy_binary codex-acp
          copy_binary zerowall-mcp-proxy
          cp -R runtime/acp "$stage/acp-runtime"
          cp -R runtime/skills/external/ai4s-skills "$stage/skills"
          cp -R runtime/skills/external/anthropic-skills "$stage/skills-office"
          cp -R runtime/skills/core "$stage/skills-core"
          cp -R runtime/skills/advanced "$stage/skills-advanced"
          cp -R runtime/skills/compute "$stage/skills-compute"
          cp -R runtime/skills/life-science "$stage/skills-life-science"
          cp -R runtime/skills/literature "$stage/skills-literature"
          cp -R runtime/skills/publishing "$stage/skills-publishing"
          cp -R runtime/goal-plugin "$stage/goal-plugin"
          cp -R runtime/harness "$stage/harness"
          asset="ZeroWall-Environment-${target}.tar.gz"
          tar -czf "$RUNNER_TEMP/$asset" -C "$stage" .
          if command -v sha256sum >/dev/null 2>&1; then
            digest="$(sha256sum "$RUNNER_TEMP/$asset" | awk '{print $1}')"
          else
            digest="$(shasum -a 256 "$RUNNER_TEMP/$asset" | awk '{print $1}')"
          fi
          size="$(wc -c < "$RUNNER_TEMP/$asset" | tr -d ' ')"
          node scripts/environment/build-manifest.mjs \
            --version "${{ github.ref_name }}-env.1" \
            --target "$target" \
            --asset-name "$asset" \
            --asset-url "https://github.com/${DOWNLOADS_REPO}/releases/download/${{ github.ref_name }}/$asset" \
            --sha256 "$digest" \
            --size "$size" \
            --output "$RUNNER_TEMP/$asset.json"
          echo "ENVIRONMENT_ASSET=$RUNNER_TEMP/$asset" >> "$GITHUB_ENV"
          echo "ENVIRONMENT_MANIFEST=$RUNNER_TEMP/$asset.json" >> "$GITHUB_ENV"
      - name: Upload environment package, manifest, and bootstrapper
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADS_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$ENVIRONMENT_ASSET" "$ENVIRONMENT_MANIFEST" \
            "$ENVIRONMENT_BOOTSTRAPPER" \
            --repo "$DOWNLOADS_REPO" --clobber

  build:
    # On a tag push, wait for the draft release to exist before building.
    # On workflow_dispatch (no tag), create-release is skipped — build anyway.
    needs: [create-release]
    if: ${{ !cancelled() }}
    env:
      ZEROWALL_ENV_UPDATE_PUBLIC_KEY: ${{ secrets.ZEROWALL_ENV_UPDATE_PUBLIC_KEY || vars.ZEROWALL_ENV_UPDATE_PUBLIC_KEY }}
      ZEROWALL_APP_UPDATE_PUBLIC_KEY: ${{ secrets.ZEROWALL_APP_UPDATE_PUBLIC_KEY || vars.ZEROWALL_APP_UPDATE_PUBLIC_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl \
            wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4   # version comes from package.json "packageManager"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require update signing keys for releases
        if: github.ref_type == 'tag'
        shell: bash
        env:
          ZEROWALL_APP_UPDATE_PRIVATE_KEY: ${{ secrets.ZEROWALL_APP_UPDATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$ZEROWALL_ENV_UPDATE_PUBLIC_KEY" || {
            echo "::error::ZEROWALL_ENV_UPDATE_PUBLIC_KEY is required for release builds"
            exit 1
          }
          test -n "$ZEROWALL_APP_UPDATE_PUBLIC_KEY" || {
            echo "::error::ZEROWALL_APP_UPDATE_PUBLIC_KEY is required for release builds"
            exit 1
          }
          test -n "$ZEROWALL_APP_UPDATE_PRIVATE_KEY" || {
            echo "::error::ZEROWALL_APP_UPDATE_PRIVATE_KEY is required for release builds"
            exit 1
          }

      - name: Build the app (Tauri)
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/desktop
          # Linux currently publishes deb+rpm; AppImage remains outside the
          # release matrix until its clean-machine install path is qualified.
          args: --target ${{ matrix.target }} ${{ startsWith(matrix.platform, 'ubuntu') && '--bundles deb,rpm' || '' }}
          # No tagName / releaseName: this action must NOT create a release here.
          # Releases are published to the public downloads repo by the upload
          # step below, from the bundles on disk (no artifact storage needed).

      - name: Sign the platform application update manifest
        if: github.ref_type == 'tag'
        shell: bash
        env:
          ZEROWALL_APP_UPDATE_PRIVATE_KEY: ${{ secrets.ZEROWALL_APP_UPDATE_PRIVATE_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          bundle_dir="apps/desktop/src-tauri/target/$target/release/bundle"
          installer=""
          if [[ "$target" == *windows* ]]; then
            installer="$(find "$bundle_dir" -name '*-setup.exe' -print -quit)"
            if [[ -z "$installer" ]]; then installer="$(find "$bundle_dir" -name '*.msi' -print -quit)"; fi
          elif [[ "$target" == *apple* ]]; then
            installer="$(find "$bundle_dir" -name '*.dmg' -print -quit)"
          else
            installer="$(find "$bundle_dir" -name '*.deb' -print -quit)"
            if [[ -z "$installer" ]]; then installer="$(find "$bundle_dir" -name '*.rpm' -print -quit)"; fi
          fi
          test -n "$installer" || {
            echo "::error::no preferred installer found for signed manifest ($target)"
            exit 1
          }
          if command -v sha256sum >/dev/null 2>&1; then
            digest="$(sha256sum "$installer" | awk '{print $1}')"
          else
            digest="$(shasum -a 256 "$installer" | awk '{print $1}')"
          fi
          size="$(wc -c < "$installer" | tr -d ' ')"
          asset_name="$(basename "$installer")"
          manifest="$RUNNER_TEMP/zerowall-app-manifest-$target.json"
          node scripts/app/build-manifest.mjs \
            --version "$TAG" \
            --target "$target" \
            --asset-name "$asset_name" \
            --asset-url "https://github.com/${DOWNLOADS_REPO}/releases/download/$TAG/$asset_name" \
            --sha256 "$digest" \
            --size "$size" \
            --output "$manifest"
          echo "APP_UPDATE_MANIFEST=$manifest" >> "$GITHUB_ENV"

      # Upload each installer directly to the draft release in the public
      # downloads repo. No actions/upload-artifact — avoids the artifact
      # storage quota entirely.
      - name: Upload installers to release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADS_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          bundle_dir="apps/desktop/src-tauri/target/$target/release/bundle"
          found=0
          for ext in dmg exe msi deb rpm AppImage; do
            while IFS= read -r f; do
              echo "uploading $(basename "$f") ..."
              gh release upload "$TAG" "$f" \
                --repo "$DOWNLOADS_REPO" --clobber
              found=$((found + 1))
            done < <(find "$bundle_dir" -name "*.$ext" 2>/dev/null || true)
          done
          gh release upload "$TAG" "$APP_UPDATE_MANIFEST" \
            --repo "$DOWNLOADS_REPO" --clobber
          echo "uploaded $found installer(s) for $target"
          if [ "$found" -eq 0 ]; then
            echo "::warning::no installers found for $target"
          fi
