name: build

# Builds macOS (.dmg/.app), Windows (NSIS .exe / .msi) and Linux
# (.deb/.rpm/.AppImage) installers. Each platform's installer can only be
# produced on its own runner — hence the matrix. On a `v*` tag push the
# installers are published as a draft Release in the SEPARATE PUBLIC downloads
# repository named by the `DOWNLOADS_REPO` env below.
#
# Why a second repository: GitHub visibility is per-repository. A private repo's
# releases and their assets require authentication to download, and there is no
# setting that exposes a single release, tag, or branch. Keeping the source
# private while letting anyone download an installer therefore needs two repos —
# this one (private: source + CI) and a public one that holds nothing but the
# installers. Nothing from this checkout is pushed there; only the built bundles
# are uploaded as release assets.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Building needs no write access: the release lives in another repository and is
# created with DOWNLOADS_TOKEN, not the automatic per-run GITHUB_TOKEN (which is
# scoped to this repository and cannot reach the public one).
permissions:
  contents: read

env:
  # Public, source-free repository that serves the installers.
  DOWNLOADS_REPO: ccfwwm/zerowallscience-releases

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl \
            wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4   # version comes from package.json "packageManager"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch bundled OpenCode sidecar
        shell: bash
        run: bash scripts/dev/fetch-opencode.sh ${{ matrix.target }}

      - name: Fetch bundled ai4s-skills pack
        shell: bash
        run: bash scripts/dev/fetch-skills.sh

      - name: Fetch bundled uv sidecar
        shell: bash
        run: bash scripts/dev/fetch-uv.sh ${{ matrix.target }}

      - name: Fetch bundled agent-browser sidecar
        shell: bash
        run: bash scripts/dev/fetch-agent-browser.sh ${{ matrix.target }}

      - name: Fetch bundled goal plugin
        shell: bash
        run: bash scripts/dev/fetch-goal-plugin.sh

      - name: Build the app (Tauri)
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/desktop
          # Linux: deb+rpm only. AppImage is off because linuxdeploy runs ldd
          # on every bundled ELF and ldd exits 1 on the Bun-built opencode
          # sidecar, aborting the whole bundle (tauri-apps/tauri#8929).
          args: --target ${{ matrix.target }} ${{ startsWith(matrix.platform, 'ubuntu') && '--bundles deb,rpm' || '' }}
          # No tagName / releaseName: this action must NOT create a release here.
          # Releases are published to the public downloads repo by the `publish`
          # job below, from the artifacts uploaded in the next step.

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: zerowall-science-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
          if-no-files-found: warn

  # Publishes the installers as a DRAFT release in the public downloads repo.
  # Draft, so the per-version changelog can be prepended and the assets checked
  # before anything becomes publicly visible — publishing is a manual click.
  publish:
    needs: build
    # Tag pushes only. A workflow_dispatch run builds and keeps the artifacts
    # without touching the public repo.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Download every platform's installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: zerowall-science-*
          merge-multiple: true

      # Bundles land in per-format subdirectories (nsis/, msi/, dmg/, deb/, …).
      # Flatten so `gh release create` receives plain file paths, and fail loudly
      # if a build silently produced nothing.
      - name: Collect installer files
        id: collect
        run: |
          set -euo pipefail
          mkdir -p dist
          find installers -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \
               -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp -n {} dist/ \;
          count=$(find dist -type f | wc -l)
          echo "collected $count installer(s):"
          ls -la dist
          if [ "$count" -eq 0 ]; then
            echo "::error::no installers were produced; refusing to create an empty release"
            exit 1
          fi

      # Standing install/first-launch notes — every draft is born with these
      # (the builds are unsigned/un-notarized, so users must clear Gatekeeper /
      # SmartScreen once). Prepend the per-version changelog before publishing.
      - name: Write release notes
        run: |
          cat > notes.md <<'NOTES'
          ## ⚠️ Install & first launch — unsigned builds

          These installers are **not code-signed or notarized**, so your OS warns on first launch. This is expected; clear it once:

          **macOS** — Apple Silicon: `…_aarch64.dmg` · Intel: `…_x64.dmg` (requires macOS 13+)
          1. Open the DMG and drag **ZeroWall Science** into Applications.
          2. If you see *"… is damaged and can't be opened"* or *"unidentified developer"*, clear the quarantine attribute in Terminal, then open normally:
             ```
             xattr -cr "/Applications/ZeroWall Science.app"
             ```

          **Windows** — `…_x64-setup.exe` or `…_x64_en-US.msi`
          - SmartScreen shows *"Windows protected your PC"* → **More info** → **Run anyway**.

          **Linux** — `.deb` / `.rpm`
          - `sudo apt install ./…_amd64.deb`  or  `sudo rpm -i …x86_64.rpm`

          > **No in-app auto-update** — download new versions from this Releases page. (The `.app.tar.gz` assets are build artifacts, not an update channel.)

          ---

          <!-- Prepend this release's changelog above this line before publishing. -->
          NOTES

      # The downloads repo has no source history, so the tag is created there on
      # its default branch (--target). Re-running the same tag replaces assets
      # rather than failing.
      - name: Publish draft release to the public downloads repo
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADS_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$DOWNLOADS_REPO" >/dev/null 2>&1; then
            echo "release $TAG exists; uploading assets with --clobber"
            gh release upload "$TAG" dist/* --repo "$DOWNLOADS_REPO" --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$DOWNLOADS_REPO" \
              --title "ZeroWall Science $TAG" \
              --notes-file notes.md \
              --draft \
              --target main
          fi
          gh release view "$TAG" --repo "$DOWNLOADS_REPO"
