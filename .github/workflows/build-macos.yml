name: macOS Electron Package

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Package identity and update channel
        required: true
        default: preview
        type: choice
        options: [preview, stable]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.9.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm audit:runtime
      - name: Build macOS package
        run: |
          if [ '${{ inputs.channel }}' = 'stable' ]; then
            pnpm package:stable:mac:${{ matrix.arch }}
          else
            pnpm package:mac:${{ matrix.arch }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: zerowall-science-${{ inputs.channel }}-macos-${{ matrix.arch }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.yml
            desktop/dist/*.blockmap
