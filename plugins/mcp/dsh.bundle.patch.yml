- id: progressive-tools
  config: {"groups":[{"id":"browser","description":"Interactive browser navigation, page inspection, clicks, forms, screenshots, and tabs.","aliases":["browser","web page","网页","浏览器"],"include":["browser_*","navigate","click","screenshot","computer_*"]},{"id":"vision","description":"Image understanding, OCR, comparison, annotation, and visual routing.","aliases":["vision","image analysis","图片","视觉","识图"],"include":["vision_*","ocr*","analyze_image*","compare_image*","describe_image*"]},{"id":"image-generation","description":"Image generation and image editing.","aliases":["image generation","generate image","生图","图片生成"],"include":["imagegen*","image_gen*","generate_image*","edit_image*","get_image_generation*","cancel_image_generation*","image_generation*"]},{"id":"filesystem","description":"Read, search, create, and edit files and directories.","aliases":["files","filesystem","code editing","文件","代码编辑"],"include":["read","write","edit","glob","grep","read_file*","write_file*","list_dir*","search_file*","str_replace*","fs_*"]},{"id":"terminal","description":"Shell commands, terminal sessions, jobs, and local process control.","aliases":["terminal","shell","command","终端","命令行"],"include":["bash","pwsh","shell_*","terminal_*","exec_*","job_*"]},{"id":"web","description":"Web search, HTTP fetching, and URL content retrieval.","aliases":["web search","internet","http","联网","网页搜索"],"include":["web_*","http_*","fetch*","search_web*"]},{"id":"database","description":"Database inspection, queries, migrations, and records.","aliases":["database","sql","数据库"],"include":["database_*","db_*","sql_*","query_*"]},{"id":"remote-ops","description":"SSH, SFTP, tunnels, and remote host operations.","aliases":["ssh","remote","server","远程","服务器"],"include":["ssh_*","sftp_*","tunnel_*","remote_*"]},{"id":"memory","description":"Durable memory, recall, notes, and knowledge retrieval.","aliases":["memory","recall","记忆","知识库"],"include":["memory_*","recall*","mneme_*","note_*"]},{"id":"workbench","description":"Workspace workbench, artifacts, previews, and project utilities.","aliases":["workbench","workspace","工作台"],"include":["workbench_*","workspace_*","artifact_*","preview_*"]},{"id":"agent-teams","description":"Team members, delegated tasks, messages, and coordination.","aliases":["team","delegate","协作","团队","子任务"],"include":["team_*","agent_team*","spawn_agent*","send_message*","followup_task*","wait_agent*","list_agent*"]},{"id":"subagents","description":"Subagent spawning, continuation, inspection, and collection.","aliases":["subagent","delegate","子智能体","委派"],"include":["subagent*","spawn*","fork_agent*","continue_agent*"]},{"id":"workflow","description":"Workflow definitions, runs, schedules, and automation control.","aliases":["workflow","automation","schedule","工作流","自动化"],"include":["workflow_*","schedule_*","automation_*","cron_*"]},{"id":"interface","description":"Generated interface components, interactive artifacts, and structured UI.","aliases":["interface","ui","组件","界面"],"include":["genui_*","ui_*","component_*"]},{"id":"omicverse","description":"OmicVerse 原生工具、CPU 分析、Python 和 Agent","include":["research_workflow","r_files","mcp__rmcp__omicverse_*"]},{"id":"r-compute","description":"R 计算、项目和任务","include":["research_workflow","mcp_connect","sc_tenifold_knockout_*","mcp__rmcp__r_runtime","mcp__rmcp__r_project","mcp__rmcp__r_execute","mcp__rmcp__r_jobs"]},{"id":"r-files","description":"R 项目文件上传、预览、下载和校验","include":["research_workflow","r_files","mcp__rmcp__r_files"]},{"id":"r-packages","description":"R 包版本、依赖和安装任务","include":["research_workflow","mcp__rmcp__r_packages"]},{"id":"r-geo","description":"GEO 公共数据和分析","include":["research_workflow","mcp__rmcp__r_geo_*"]},{"id":"r-nhanes","description":"NHANES 调查加权分析","include":["research_workflow","mcp__rmcp__r_nhanes_*"]},{"id":"biomni","description":"远程 Biomni Agent 和数据湖","include":["research_workflow","mcp__rmcp__biomni_*"]},{"id":"figureya","description":"FigureYa 模板、绘图和产物","include":["research_workflow","r_files","mcp__rmcp__r_figureya_*"]},{"id":"research-study","description":"结构化研究记录与确定性方法适用性检查","include":["research_study","method_check_evaluate","research_workflow"]},{"id":"science-viewer","description":"科研资产查看、区域选择与可溯源序列分析","include":["science_viewer"]},{"id":"bio","description":"统一生物分析、本地 BioGenie 和数据库检索","include":["bio_local","mcp__zerowall_managed_bio_tools__*"]},{"id":"python-environment","description":"托管 Python 运行、包管理、进度和回滚","include":["python","python_environment"]},{"id":"chemistry-editor","description":"Ketcher 分子编辑、结构读取和导出","include":["mcp__zerowall_managed_ketcher__*"]}],"skillBindings":[{"skill":"zerowall-rmcp","groups":["r-compute","r-files","r-packages","r-geo","r-nhanes","biomni","figureya","omicverse"]},{"skill":"zerowall-omicverse","groups":["omicverse"]},{"skill":"zerowall-omicverse-singlecell","groups":["omicverse"]},{"skill":"zerowall-omicverse-bulk","groups":["omicverse"]},{"skill":"zerowall-omicverse-spatial","groups":["omicverse"]},{"skill":"zerowall-omicverse-multiomics","groups":["omicverse"]},{"skill":"zerowall-omicverse-agent","groups":["omicverse"]},{"skill":"zerowall-rplatform","groups":["r-compute"]},{"skill":"zerowall-r-files","groups":["r-files"]},{"skill":"zerowall-r-packages","groups":["r-packages"]},{"skill":"zerowall-geo","groups":["r-geo"]},{"skill":"zerowall-nhanes","groups":["r-nhanes","research-study"]},{"skill":"zerowall-rbioagent","groups":["biomni"]},{"skill":"zerowall-rplotfigure","groups":["figureya"]},{"skill":"sc-tenifold-knockout","groups":["r-compute","r-files"]},{"skill":"zerowall-bio","groups":["bio","biomni","omicverse","python-environment"]},{"skill":"zerowall-python-packages","groups":["python-environment"]},{"skill":"local-env-setup","groups":["python-environment"]},{"skill":"zerowall-ketcher","groups":["chemistry-editor"]},{"skill":"zerowall-research-orchestrator","groups":["r-compute","r-files","omicverse","research-study"]},{"skill":"method-choice","groups":["research-study"]},{"skill":"zerowall-research-evidence","groups":["r-compute","figureya","research-study"]},{"skill":"zerowall-claim-audit","groups":["research-study","figureya"]},{"skill":"academic-pipeline","groups":["research-study","r-files","figureya"]},{"skill":"academic-paper","groups":["research-study","r-files","figureya"]},{"skill":"academic-paper-reviewer","groups":["research-study","r-files","figureya"]},{"skill":"deep-research","groups":["research-study","r-files","figureya"]},{"skill":"zerowall-data-contract","groups":["r-compute","r-files","r-nhanes","research-study"]},{"skill":"zerowall-mr","groups":["r-compute","r-files","research-study"]},{"skill":"zerowall-colocalization","groups":["r-compute","r-files","research-study"]},{"skill":"zerowall-intervention-response","groups":["omicverse","r-compute"]},{"skill":"zerowall-fiji","groups":["science-viewer","r-files","r-compute"]},{"skill":"zerowall-fiji-western-blot","groups":["science-viewer","r-files","r-compute"]},{"skill":"zerowall-fiji-scratch-wound","groups":["science-viewer","r-files","r-compute"]},{"skill":"zerowall-fiji-colony-formation","groups":["science-viewer","r-files","r-compute"]},{"skill":"zerowall-fiji-bacterial-cfu","groups":["science-viewer","r-files","r-compute"]},{"skill":"zerowall-fiji-tube-formation","groups":["science-viewer","r-files","r-compute"]},{"skill":"zerowall-molecule-docking","groups":["science-viewer","r-files","biomni"]},{"skill":"zerowall-napari","groups":["science-viewer","r-files"]},{"skill":"zerowall-brainglobe","groups":["r-compute","r-files"]},{"skill":"zerowall-image-intensity","groups":["science-viewer"]},{"skill":"zerowall-image-mask","groups":["science-viewer"]},{"skill":"zerowall-cells","groups":["science-viewer","r-files","omicverse"]},{"skill":"zerowall-he","groups":["r-compute","r-files"]},{"skill":"zerowall-sanger","groups":["r-files"]},{"skill":"zerowall-flow","groups":["r-compute","r-files"]},{"skill":"zerowall-sequence","groups":["science-viewer","r-files"]},{"skill":"zerow