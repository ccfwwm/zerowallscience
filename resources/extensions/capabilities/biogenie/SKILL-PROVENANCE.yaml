# 吸收台账（skill 内容来源与改造记录）
#
# 用途：任何 skill 的第三方来源、基线 commit、许可、吸收方式与改造摘要都登记在此，
# 供合规审计与后续维护（上游更新时判断是否值得跟进）。skill 正文末尾的 HTML 注释是
# 同样信息的随文副本，本文件是机器可读的汇总。
#
# 许可立场：只吸收 MIT / Apache-2.0 / BSD / CC-BY 系。GPL / AGPL / LGPL / CC-BY-SA /
# CC-BY-NC / Proprietary 一律**不复制文本**（可读、可参考思路，不可搬运）。
# 许可未核实前按「仅参考思路」处理。
#
# 改造纪律：吸收 ≠ 照抄 —— 必须补 language 标注、对齐我方工具名（bio_*）、换成我方
# 领域口径（分子生物学 / 合成生物学 / 代谢建模），并剥离平台私有配置。

version: 1
verified_on: "2026-09-11"

sources:

  - repo: aipoch/medical-research-skills
    url: https://github.com/aipoch/medical-research-skills
    commit: f5ef65b9bea79b6dd9553f52f95b0d08f7d64d26
    license: MIT
    license_file: LICENSE
    upstream_status: active
    audit: "605 个 SKILL.md 全部许可干净（600 显式 MIT + 5 继承根 LICENSE）"
    absorbed_on: "2026-09-11"
    absorbed:
      - target: skills/bio-evidence-appraisal.md
        source_skills:
          - "Evidence Insight/evidence-level-ranker"
          - "Evidence Insight/scientific-critical-thinking"
        mode: "改造（重写）"
        summary: >
          取四轴评估（证据家族/执行质量/验证深度/表述纪律）、引用角色五档、越界五型与硬规则；
          新增基础研究 B1-B5 梯级与「计算预测默认 B5」判据，对齐分子生物/合成生物学口径；
          输出结构由 10 节模板简化为「四轴 + 报告骨架」；全部书目锚点经 PubMed 实测核验后重写。
      - target: "skills/bio-literature-review.md（§三-§五 新增）"
        source_skills:
          - "Academic Writing/systematic-review"
          - "Evidence Insight/rct-bias-assessment-rob2"
        mode: "改造（并入已有 skill）"
        summary: >
          取 PRISMA 2020 八步流程、两阶段筛选、偏倚评估工具选择表、定量合成要点；
          剥离 ScienceClaw/PROSPERO 平台耦合步骤，补入「PRISMA 适用边界」（叙述性/范围/活体综述）
          与「不可合并时改结构化叙述综合」两条实操判据。
      - target: "skills/protocols/statistics.md（§四-§五、§八 新增）"
        source_skills:
          - "Protocol Design/sample-size-and-power-planning-assistant"
          - "Data Analysis/statistical-analysis"
        mode: "改造（并入已有协议）"
        summary: >
          取规划姿态五档、假设质量分级、情景规划、功效威胁清单、效应量对照表、统计陷阱清单；
          临床「患者/招募」口径改为生物学重复口径；配方重写为 statsmodels 版本并在本机插件
          venv 实测（含 MDE、失访膨胀、Cohen's h、BH-FDR 的实测数值）。
    reference_only:
      - target: skill-auditor（MedSkillAudit）
        mode: "仅参考思路（未复制文本）"
        summary: >
          scripts/test-skills.mjs 的静态质量门（description 长度 / 目录预算 / 主词唯一性 /
          代码块可执行性）与 scripts/skill-standards-baseline.json 的棘轮机制，参考其
          「否决门 + 分级评分 + P0/P1/P2 建议」结构；未引入其运行时（9 步流水线不落地）。

  - repo: jaechang-hits/SciAgent-Skills
    url: https://github.com/jaechang-hits/SciAgent-Skills
    commit: fe505cae14d20b6c33be2e49666425be98f005bb
    license: "根 CC-BY-4.0；per-skill 混杂 23 种（含 GPL/AGPL/LGPL/CC-BY-SA/CC-BY-NC-SA/Proprietary）"
    audit: "208 条逐条筛选：166 可吸收 / 11 需谨慎 / 31 禁止；本次只取 CC-BY-4.0 的期刊规格与统计标注两类"
    upstream_status: active
    absorbed_on: "2026-09-11"
    absorbed:
      - target: "skills/bio-figure.md（期刊规格速查节）"
        source_skills: "scientific-writing/{nature,science,cell,pnas,lancet,nejm,elife,cancer-research,general}-figure-guide"
        license: CC-BY-4.0
        mode: "改造（事实层重写 + 官方页复核）"
        summary: >
          取 9 刊的宽度/DPI/字体/panel 标签约定/格式/色彩模式事实；**逐条对官方页复核**，
          复核发现其 Science 栏宽（3.4/5.0/7.0 in）与 PNAS 栏宽与官方页不符，已改用官方值；
          宽度与格式以 python/figurelib/assets/publisher_profiles.json 的带源快照为准。
      - target: "skills/protocols/pub-figure.md（显著性标注配方）"
        source_skills: "data-visualization/statistical-significance-annotation"
        license: CC-BY-4.0
        mode: "改造（重写为可执行配方）"
        summary: >
          取星号约定表（ns/*/**/***/****）、校正后 p 值纪律、比较选择规则；重写实现配方
          并补 y 轴留白与 dodge 坐标两个实测坑；多面板一节（9b）为自写（外部 multipanel 为 Proprietary，未用）。
    reference_only:
      - target: "data-visualization/multipanel"
        mode: "不可用（Proprietary, HITS Inc.）"
        summary: "多面板配方由本仓库自写（GridSpec + sharex/sharey + add_panel_labels）。"

  - repo: Haojae/scipilot-figure-skill
