    license: MIT
    upstream_status: active
    absorbed_on: "2026-08 前"
    absorbed:
      - target: "python/figurelib/assets/（nature/publication/presentation.mplstyle、publisher_profiles.json、color_palettes.py）"
        mode: "直抄（vendor）"
        summary: "期刊样式与配色资产。"
      - target: "skills/protocols/（坐标系统 / 统计检验 / 富集解读 / 文献检索策略等）"
