[package]
name = "zerowall-acp-host"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
