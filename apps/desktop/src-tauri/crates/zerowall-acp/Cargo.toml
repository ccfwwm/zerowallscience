[package]
name = "zerowall-acp"
version = "0.1.0"
description = "ZeroWall Science ACP client — drives external ACP-compliant coding agents over stdio JSON-RPC."
authors = ["ZeroWall Science contributors"]
edition = "2021"
license = "MIT"

[dependencies]
# The Zed Agent Client Protocol SDK (Apache-2.0). This crate is an ORIGINAL
# implementation written against this SDK's public API — it is not derived from
# any other ACP client. Apache-2.0 is MIT-compatible; see NOTICE.
agent-client-protocol = { version = "1.3", features = ["unstable_end_turn_token_usage"] }
async-process = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt", "macros", "sync", "time"] }
futures = "0.3"
# The ACP SDK traces complete JSON-RPC structures at debug/trace levels. The
# driver installs a scoped no-op subscriber so those payloads never reach the
# application's subscriber without disabling diagnostics in unrelated crates.
tracing = "0.1"
