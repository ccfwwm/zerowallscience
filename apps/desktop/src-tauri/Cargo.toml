[package]
name = "zerowall-science"
version = "0.4.25"
description = "ZeroWall Science"
authors = ["ZeroWall Science contributors"]
edition = "2021"

[lib]
name = "zerowall_science_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: transparent webview background for the vibrancy sidebar
# (tauri.macos.conf.json); no-op on other platforms.
# tray-icon + image-png: minimize-to-tray on window close (src/lib.rs).
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already in the tree via tauri — used directly for stall timeouts on uv setup.
tokio = { version = "1", features = ["time"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
getrandom = "0.4.3"
keyring = "4.1.5"
opener = { version = "0.8.5", features = ["reveal"] }
rusqlite = { version = "0.32", features = ["bundled"] }
# Addresses the workspace content store (src/science_store.rs). Already compiled
# as a transitive dependency, so naming it here pulls in nothing new.
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
# Watches the active workspace so file changes from outside the app (an external
# editor, a detached process) still enqueue a debounced git snapshot.
notify = "6"
# The ACP client crate (MIT, original implementation over the Apache-2.0
# agent-client-protocol SDK) — drives external coding agents (Codex, Claude
# Code) as a switchable second runtime. See crates/zerowall-acp.
zerowall-acp = { path = "crates/zerowall-acp" }
# The ACP crate's public API returns futures channels (mpsc/oneshot); the
# consumer (acp_consumer.rs) drives that receiver and answers permission oneshots.
futures = "0.3"

# Read-only registry check for WSL: the Lxss key exists exactly when a distro is
# registered, so we can gate spawning wsl.exe (which would otherwise trigger the
# install stub on a machine without WSL). See src/wsl.rs.
[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"

# Already in the tree via tao — used to re-pin the traffic lights (src/macos.rs).
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSButton",
    "NSControl",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
