[package]
name = "zerowall-environment-bootstrapper"
version = "0.1.0"
edition = "2021"
description = "ZeroWall Science environment bootstrapper"

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
flate2 = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
