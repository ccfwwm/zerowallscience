packages:
  - desktop
  - plugins/*
  - '!plugins/wechat'
  - deepseek-harness
  - deepseek-harness/vendor/*
  - deepseek-harness/packages/*/*
  - deepseek-harness/native/system
  - deepseek-harness/native/system/packages/*
  - deepseek-harness/apps/*
  - deepseek-harness/benchmarks
  - deepseek-harness/website
  - deepseek-harness/examples
  - deepseek-harness/python/sdk-runtime

linkWorkspacePackages: true
autoInstallPeers: false

# `pnpm run` would otherwise re-check dependency status and shell out to
# `pnpm install` before every script. The lockfile is already the gate, and the
# implicit install re-runs `deepseek-harness`'s lefthook postinstall, which refuses to
# migrate the submodule's `core.worktree` out of its common git config and fails
# the whole build. Install explicitly instead.
verifyDepsBeforeRun: false

overrides:
  'micromark-util-types': '2.0.2'
  '@electron/get': '5.1.0'
  'react': '18.2.0'
  'react-dom': '18.2.0'
  '@deepseek-ai/cosmokit': 'link:deepseek-harness/vendor/cosmokit'
  '@deepseek-ai/schemastery': 'link:deepseek-harness/vendor/schemastery'

peerDependencyRules:
  ignoreMissing:
    - '@deepseek-ai/dsh-client-runtime'
  allowedVersions:
    typescript: '>=5 <7'

allowBuilds:
  msgpackr-extract: false
  dsh-better-sidebar: true
  esbuild: true
  electron: true
  electron-winstaller: false
  node: true
  node-pty: true
  koffi: true
  lefthook: false
  '@deepseek-ai/dsh-subprocess-local@file:deepseek-harness/packages/subprocess/subprocess-local': true
  '@google/genai': false
  protobufjs: false
  node-addon-require-builtin: false
  # Registry release includes compiled host/client entries; no install build needed.
  dsh-zotero: false
  '@scarf/scarf': false
  # Both packages are optional accelerators for the SSH client. Keep their
  # native build scripts blocked; ssh2 falls back to its supported JS path.
  cpu-features: false
  ssh2: false

minimumReleaseAgeExclude:
  - "@deepseek-ai/libreoffice-kit@0.1.5"
  - "@deepseek-ai/libreoffice-kit-darwin-arm64@0.1.5"
  - "@deepseek-ai/libreoffice-kit-darwin-x64@0.1.5"
  - "@deepseek-ai/libreoffice-kit-win32-arm64@0.1.5"
  - "@deepseek-ai/libreoffice-kit-win32-x64@0.1.5"
  - "@deepseek-ai/libreoffice-kit-wasm@0.1.5"
  - "@earendil-works/pi-telemetry@1.1.0"
  - "node-addon-native-custom-loader@0.1.9"
  - "node-addon-require-builtin-darwin-arm64@0.1.9"
  - "node-addon-require-builtin-darwin-x64@0.1.9"
  - "node-addon-require-builtin-linux-arm64-gnu@0.1.9"
  - "node-addon-require-builtin-linux-x64-gnu@0.1.9"
  - "node-addon-require-builtin-linux-arm64-musl@0.1.9"
  - "node-addon-require-builtin-linux-x64-musl@0.1.9"
  - "node-addon-require-builtin-win32-arm64-msvc@0.1.9"
  - "node-addon-require-builtin-win32-ia32-msvc@0.1.9"
  - "node-addon-require-builtin-win32-x64-msvc@0.1.9"
  - "node-addon-require-builtin@0.1.9"
  - "@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.263"
  - "@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.263"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.263"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.263"
  - "@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.263"
  - "@anthropic-ai/claude-agent-sdk-linux-x64@0.3.263"
  - "@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.263"
  - "@anthropic-ai/claude-agent-sdk-win32-x64@0.3.263"
  - "@anthropic-ai/claude-agent-sdk@0.3.263"
  - "@openai/codex@0.153.4||0.153.4-darwin-arm64||0.153.4-darwin-x64||0.153.4-linux-arm64||0.153.4-linux-x64||0.153.4-win32-arm64||0.153.4-win32-x64"
  - "@trycua/cua-driver-darwin-arm64@0.28.0"
  - "@trycua/cua-driver-darwin-x64@0.28.0"
  - "@trycua/cua-driver-linux-arm64-gnu@0.28.0"
  - "@trycua/cua-driver-linux-x64-gnu@0.28.0"
  - "@trycua/cua-driver-win32-arm64-msvc@0.28.0"
  - "@trycua/cua-driver-win32-x64-msvc@0.28.0"
  - "@trycua/cua-driver@0.28.0"
  - "pnpm@11.28.5"
  - "electron@44.7.0"
  - '@earendil-works/pi-ai@1.1.0'
  - dsh-better-sidebar@0.25.0
  - dsh-dream-skin@10.16.0
  - dsh-free-search@0.9.4

packageExtensions:
  'dsh-office-tools@*':
    dependencies:
      '@deepseek-ai/cordis': 'workspace:*'
      '@deepseek-ai/schemastery': 'workspace:*'
      '@deepseek-ai/dsh-agent': 'workspace:*'
      '@deepseek-ai/dsh-fs': 'workspace:*'
      '@deepseek-ai/dsh-llm': 'workspace:*'
      '@deepseek-ai/dsh-session': 'workspace:*'
      '@deepseek-ai/dsh-tools': 'workspace:*'
  'dsh-free-search@0.9.4':
    peerDependencies:
      '@deepseek-ai/dsh-client-ui-commands': '^0.1.7-rc.1 || ^0.2.0-rc.2'
      '@deepseek-ai/dsh-client-ui-plugin-manager': '^0.1.7-rc.1 || ^0.2.0-rc.2'
      '@deepseek-ai/dsh-client-ui-renderer': '^0.1.7-rc.1 || ^0.2.0-rc.2'
      '@deepseek-ai/dsh-settings': '^0.1.7-rc.1 || ^0.2.0-rc.2'
      '@deepseek-ai/dsh-tools': '^0.1.7-rc.1 || ^0.2.0-rc.2'
  # Zotero 0.12.1 was published against the 0.1.7 API surface. Its runtime
  # integration remains compatible with the rc.2 package family shipped by
  # dsh-v0.2.0-rc.2, so widen only this exact package's peers.
  'dsh-zotero@0.12.1':
    peerDependencies:
      '@deepseek-ai/dsh-api-remotes': '0.1.7-rc.2 || ^0.2.0-rc.2'
      '@deepseek-ai/dsh-client-locale': '0.1.7-rc.2 || ^0.2.0-rc.2'
      '@deepseek-ai/dsh-client-store': '0.1.7-rc.2 || ^0.2.0-rc.2'
      '@deepseek-ai/dsh-client-ui-chat': '0.1.7-rc.2 || ^0.2.0-rc.2'
      '@deepseek-ai/dsh-client-ui-conversation': '0.1.7-rc.2 || ^0.2.0-rc.2'
      '@deepseek-ai/dsh-client-ui-primitives': '0.1.7-rc.2 || ^0.2.0-rc.2'
      '@deepseek-ai/dsh-client-ui-renderer': '0.1.7-rc.2 || ^0.2.0-rc.2'
      '@deepseek-ai/dsh-client-ui-session': '0.1.7-rc.2 || ^0.2.0-rc.2'
      '@deepseek-ai/dsh-client-ui-settings': '0.1.7-rc.2 || ^0.2.0-rc.2'
      '@deepseek-ai/dsh-client-ui-slots': '0.1.7-rc.2 || ^0.2.0-rc.2'
      '@deepseek-ai/dsh-commands': '0.1.7-rc.2 || ^0.2.0-rc.2'
      '@deepseek-ai/dsh-credentials': '0.1.7-rc.2 || ^0.2.0-rc.2'
      '@deepseek-ai/dsh-llm': '0.1.7-rc.2 || ^0.2.0-rc.2'
      '@deepseek-ai/dsh-system-prompt': '0.1.7-rc.2 || ^0.2.0-rc.2'
      '@deepseek-ai/dsh-timeout': '0.1.7-rc.2 || ^0.2.0-rc.2'
      '@deepseek-ai/dsh-tools': '0.1.7-rc.2 || ^0.2.0-rc.2'
      '@deepseek-ai/dsh-typert-protocol': '0.1.7-rc.2 || ^0.2.0-rc.2'
      '@deepseek-ai/dsh-typert-registry': '0.1.7-rc.2 || ^0.2.0-rc.2'
      '@deepseek-ai/dsh-user-questions': '0.1.7-rc.2 || ^0.2.0-rc.2'
      '@deepseek-ai/dsh-util-values': '0.1.7-rc.2 || ^0.2.0-rc.2'

patchedDependencies:
  '@earendil-works/pi-ai@1.1.0': deepseek-harness/patches/@earendil-works__pi-ai@1.1.0.patch
  dsh-dream-skin@10.16.0: plugins/dsh-dream-skin/patches/dsh-dream-skin@10.16.0.patch
  "@electron/osx-sign@1.3.3": deepseek-harness/patches/@electron__osx-sign@1.3.3.patch
  "@fortune-sheet/core@1.0.4": deepseek-harness/patches/@fortune-sheet__core@1.0.4.patch
  "@fortune-sheet/react@1.0.4": deepseek-harness/patches/@fortune-sheet__react@1.0.4.patch
  "@yao-pkg/pkg@6.21.0": deepseek-harness/patches/@yao-pkg__pkg@6.21.0.patch
  "app-builder-lib@26.17.0": deepseek-harness/patches/app-builder-lib@26.17.0.patch
  "exceljs@4.4.0": deepseek-harness/patches/exceljs@4.4.0.patch
  "node-pty@1.2.0-beta.15": deepseek-harness/patches/node-pty@1.2.0-beta.15.patch
