packages:
  - desktop
  - store
  - plugins/*
  - '!plugins/wechat'
  - packages/*
  # Removed from the 7.3.0 runtime; keep the source tree for audit/recovery,
  # but do not install or build the incompatible legacy package.
  - '!packages/dsh-capability-menu'
  - deepseek-harness
  - deepseek-harness/vendor/*
  - deepseek-harness/packages/*/*
  - deepseek-harness/native/system
  - deepseek-harness/native/system/packages/*
  - deepseek-harness/apps/*
  - deepseek-harness/benchmarks
  - deepseek-harness/website
  - deepseek-harness/examples
  - deepseek-harness/python/sdk-runtime

linkWorkspacePackages: true
autoInstallPeers: false

# `pnpm run` would otherwise re-check dependency status and shell out to
# `pnpm install` before every script. The lockfile is already the gate, and the
# implicit install re-runs `deepseek-harness`'s lefthook postinstall, which refuses to
# migrate the submodule's `core.worktree` out of its common git config and fails
# the whole build. Install explicitly instead.
verifyDepsBeforeRun: false

overrides:
  'dsh-progressive-tools>@deepseek-ai/cordis': 'workspace:*'
  'dsh-progressive-tools>@deepseek-ai/dsh-agent': 'workspace:*'
  'dsh-progressive-tools>@deepseek-ai/dsh-agent-loop': 'workspace:*'
  'dsh-progressive-tools>@deepseek-ai/dsh-llm': 'workspace:*'
  'dsh-progressive-tools>@deepseek-ai/dsh-scope': 'workspace:*'
  'dsh-progressive-tools>@deepseek-ai/dsh-session': 'workspace:*'
  'dsh-progressive-tools>@deepseek-ai/dsh-system-prompt': 'workspace:*'
  'dsh-progressive-tools>@deepseek-ai/dsh-tools': 'workspace:*'
  'dsh-progressive-tools>@deepseek-ai/dsh-attachment': 'workspace:*'
  'dsh-progressive-tools>@deepseek-ai/dsh-session-projection': 'workspace:*'
  'dsh-progressive-tools>@deepseek-ai/dsh-session-persistence': 'workspace:*'
  'dsh-progressive-tools>@deepseek-ai/dsh-settings': 'workspace:*'
  'dsh-progressive-tools>@deepseek-ai/dsh-user-approval': 'workspace:*'
  'dsh-progressive-tools>@deepseek-ai/dsh-ptc-runtime': 'workspace:*'
  'tsdown': '0.22.2'
  '@tsdown/css': '0.22.2'
  '@electron/get': '5.1.0'
  'react': '18.2.0'
  'react-dom': '18.2.0'
  '@deepseek-ai/dsh-llm-pi-ai>@earendil-works/pi-ai': '0.85.1'
  '@deepseek-ai/cosmokit': 'link:deepseek-harness/vendor/cosmokit'
  '@deepseek-ai/schemastery': 'link:deepseek-harness/vendor/schemastery'

peerDependencyRules:
  ignoreMissing:
    - '@deepseek-ai/dsh-client-runtime'
  allowedVersions:
    typescript: '>=5 <7'

allowBuilds:
  dsh-better-sidebar: true
  esbuild: true
  electron: true
  electron-winstaller: true
  node: true
  node-pty: true
  koffi: true
  lefthook: false
  '@deepseek-ai/dsh-subprocess-local@file:deepseek-harness/packages/subprocess/subprocess-local': true
  '@google/genai': false
  protobufjs: false
  node-addon-require-builtin: false
  # Registry release includes compiled host/client entries; no install build needed.
  dsh-zotero: false
  '@scarf/scarf': false
  # Both packages are optional accelerators for the SSH client. Keep their
  # native build scripts blocked; ssh2 falls back to its supported JS path.
  cpu-features: false
  ssh2: false

minimumReleaseAgeExclude:
  # Explicitly requested integration pin, published today.
  - 'dsh-univer-office@0.3.5'
  - '@huanlin/dsh-plugin-better-sidebar-plugin-office@0.2.0'
  - '@earendil-works/pi-ai@0.85.1'
  - dsh-better-sidebar@0.22.1
  - dsh-dream-skin@9.27.1
  - dsh-free-search@0.5.0

patchedDependencies:
  dsh-dream-skin@9.27.1: patches/dsh-dream-skin@9.27.1.patch
  dsh-free-search@0.5.0: patches/dsh-free-search@0.5.0.patch

packageExtensions:
  'dsh-office-tools@*':
    dependencies:
      '@deepseek-ai/cordis': 'workspace:*'
      '@deepseek-ai/schemastery': 'workspace:*'
      '@deepseek-ai/dsh-agent': 'workspace:*'
      '@deepseek-ai/dsh-fs': 'workspace:*'
      '@deepseek-ai/dsh-llm': 'workspace:*'
      '@deepseek-ai/dsh-session': 'workspace:*'
      '@deepseek-ai/dsh-tools': 'workspace:*'
  # Office 0.2.0 uses Better Sidebar's stable registerFileViewer API. Its
  # published peer range was not widened beyond 0.17, so record the verified
  # 0.22.1 compatibility as a local, bounded adapter.
  '@huanlin/dsh-plugin-better-sidebar-plugin-office@0.2.0':
    peerDependencies:
      dsh-better-sidebar: '^0.17.0 || ^0.21.1 || ^0.22.0 || ^0.22.1'
