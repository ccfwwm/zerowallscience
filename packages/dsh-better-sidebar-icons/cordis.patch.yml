# dsh-better-sidebar-icons bundle patch
#
# This file is the `dsh.bundle.patch` layer of the published npm package:
# when the plugin is installed through the official CLI —
#
#   dsh plugin --profile <name> add dsh-better-sidebar-icons@<version>
#
# — the command reconciles `dsh.profile.bundles` against installed packages
# and, seeing this declaration, appends `dsh-better-sidebar-icons` to the bundle
# stack. The profile boot then merges THIS patch (a single `insert` of the
# plugin row) exactly like the manual cordis.patch.yml mount line used
# before. No profile file edits needed — one command installs and mounts.
#
# The client half (lib/client.js) is picked up by the client-modules compose
# (keys on the package name), so this row only mounts the host half.
- insert:
    - id: better-sidebar-icons
      name: 'dsh-better-sidebar-icons'
