      <rect x="152" y="318" width="76" height="34" rx="17" fill="#ffffff" stroke="#93c5fd"/>
      <text x="190" y="341" text-anchor="middle" fill="#1d4ed8">分发</text>
      <rect x="240" y="318" width="118" height="34" rx="17" fill="#ffffff" stroke="#93c5fd"/>
      <text x="299" y="341" text-anchor="middle" fill="#1d4ed8">稳定前缀</text>
    </g>
    <text x="66" y="400" font-size="14" fill="#64748b">线上 9 个工具   /   完整目录在进程内   /   走原有执行管线</text>
  </g>
  <g fill="none" stroke="#60a5fa" stroke-width="1.5" opacity=".62">
    <path d="M838 96L1010 64L1158 138L1210 268L1068 352L892 318L790 210Z"/>
    <path d="M838 96L1008 214L1158 138M1008 214L1068 352M1008 214L892 318M1008 214L1210 268M1010 64L1008 214M790 210L1008 214"/>
    <circle cx="1008" cy="214" r="118" stroke-dasharray="3 12" opacity=".42"/>
    <circle cx="1008" cy="214" r="168" stroke-dasharray="2 18" opacity=".32"/>
  </g>
  <g stroke="#2563eb" stroke-width="2">
    <circle cx="838" cy="96" r="9" fill="#ffffff"/>
    <circle cx="1010" cy="64" r="7" fill="#3b82f6"/>
    <circle cx="1158" cy="138" r="10" fill="#ffffff"/>
    <circle cx="1210" cy="268" r="8" fill="#0ea5e9"/>
    <circle cx="1068" cy="352" r="10" fill="#ffffff"/>
    <circle cx="892" cy="318" r="8" fill="#38bdf8" stroke="#2563eb"/>
    <circle cx="790" cy="210" r="8" fill="#ffffff"/>
    <circle cx="1008" cy="214" r="58" fill="#ffffff"/>
    <circle cx="1008" cy="214" r="66" fill="none" opacity=".18" stroke-width="8"/>
