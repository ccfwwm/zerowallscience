    <text x="66" y="280" font-size="20" fill="#475569">缓存稳定  /  精简请求面  /  完整目录留在内存</text>
    <g font-size="15">
      <rect x="64" y="318" width="76" height="34" rx="17" fill="#ffffff" stroke="#93c5fd"/>
