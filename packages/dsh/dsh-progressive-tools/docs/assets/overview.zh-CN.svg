<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">DSH Progressive Tools</title>
  <desc id="desc">by everclear077</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#f7fbff"/><stop offset="1" stop-color="#e7f1fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="48%" r="52%">
      <stop stop-color="#3b82f6" stop-opacity=".16"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#2563eb"/><stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#60a5fa" opacity=".18"/>
    </pattern>
  </defs>
  <rect width="1280" height="440" rx="24" fill="url(#bg)" stroke="#c5daf3" stroke-width="2"/>
  <rect width="1280" height="440" rx="24" fill="url(#dots)"/>
  <ellipse cx="1020" cy="210" rx="320" ry="280" fill="url(#glow)"/>
  <path d="M64 67h36" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <text x="116" y="73" font-family="Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="14" letter-spacing="3.2" fill="#5b7c99">@EVERCLEAR077</text>
  <g font-family="Noto Sans SC,Microsoft YaHei,Arial,sans-serif">
    <text x="62" y="156" font-size="62" font-weight="700" fill="#0f172a">DSH 渐进式</text>
