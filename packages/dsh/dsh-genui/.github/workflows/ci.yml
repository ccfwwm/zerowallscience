name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # minimum 验证支持下限；preview-floor 与 preview-latest 验证发布标签。
        # 宿主发布新版本时显式更新这里，禁止跟随可变的 master 冒充验收。
        include:
          - node: 22
            host-ref: "dsh-v0.1.2-rc.1"
            channel: minimum
          - node: 24
            host-ref: "dsh-v0.1.2-rc.1"
            channel: minimum
          - node: 22
            host-ref: "dsh-v0.1.7-alpha.1"
            channel: preview-floor
          - node: 24
            host-ref: "dsh-v0.1.7-alpha.1"
            channel: preview-floor
          - node: 22
            host-ref: "dsh-v0.1.7-rc.2"
            channel: preview-latest
          - node: 24
            host-ref: "dsh-v0.1.7-rc.2"
            channel: preview-latest
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      # 宿主 checkout 供真实 packed e2e 使用；最低版本检查使用锁定的发布声明，
      # preview API 检查在隔离目录安装对应标签的 npm 发布包。
      - name: Clone pinned DSH host at DSH_ROOT
        run: |
          DSH_ROOT="$GITHUB_WORKSPACE/../../.dsh/source/current"
          mkdir -p "$(dirname "$DSH_ROOT")"
          git clone --depth 1 --branch "${{ matrix.host-ref }}" "https://github.com/deepseek-ai/deepseek-harness.git" "$DSH_ROOT"
          test -f "$DSH_ROOT/packages/client/ui-primitives/src/index.ts" || { echo "::error::宿主预检失败：ui-primitives 源码缺失"; exit 1; }
          echo "HOST_SHA=$(git -C "$DSH_ROOT" rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install + build host
        working-directory: ${{ github.workspace }}/../../.dsh/source/current
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install plugin dependencies
        run: pnpm install --frozen-lockfile

      - name: Check (typecheck + full tests + build)
        if: matrix.channel == 'minimum'
        run: pnpm run check

      - name: Check published host API (typecheck + build)
        if: matrix.channel != 'minimum'
        run: pnpm run check:host-api "${{ matrix.host-ref }}"

      - name: Verify and pack plugin tarball
        id: pack
        run: node scripts/verify-pack.mjs --keep

      # no-key smoke：隔离 DSH_HOME + 精确宿主二进制 + 固定端口，绝不触碰
      # 任何活跃实例；宿主二进制必须位于本次 checkout 内。
      - name: Smoke e2e (no model key)
        run: |
          node scripts/e2e.mjs --smoke --install tarball --tarball "${{ steps.pack.outputs.tarball }}" --tarball-sha256 "${{ steps.pack.outputs.sha256 }}" --port 3190
        env:
          DSH_ROOT: ${{ github.workspace }}/../../.dsh/source/current
          DSH_BIN: ${{ github.workspace }}/../../.dsh/source/current/apps/cli/lib/bin.js

      - name: Archive e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e-*.png
            dsh-web.log
          if-no-files-found: ignore

  windows-pack:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Pack
        run: npm pack --json
